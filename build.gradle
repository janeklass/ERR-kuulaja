plugins {
    id 'com.android.application' version '8.13.2' apply false
}

// Ehituskaust OneDrive'ist väljas: sünkroonija lukustab muidu vahefaile ja ehitus ebaõnnestub.
allprojects {
    layout.buildDirectory.set(new File(System.getProperty("user.home"),
            "AppData/Local/ERR-kuulaja-build/" + project.name))
}
