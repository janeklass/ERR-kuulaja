plugins {
    id 'com.android.application'
}

android {
    namespace 'ee.janek.errkuulaja'
    compileSdk 36

    defaultConfig {
        applicationId 'ee.janek.errkuulaja'
        minSdk 26
        targetSdk 34
        versionCode 12
        versionName '1.11'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Lihtsuse mõttes allkirjastatakse debug-võtmega, et APK oleks kohe paigaldatav
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
